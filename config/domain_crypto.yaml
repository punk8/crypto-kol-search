domain: crypto
display_name: Cryptocurrency / Web3

# Seed handles file (relative to project root)
seed_file: seeds/crypto_handles.txt

# Search queries used for autonomous discovery
keywords:
  - bitcoin OR BTC
  - ethereum OR ETH
  - solana OR SOL
  - 'defi OR "decentralized finance"'
  - memecoin OR meme coin
  - crypto OR cryptocurrency
  - blockchain OR web3
  - '"$BTC" OR "$ETH" OR "$SOL"'
  - 'NFT OR "layer 2" OR L2'
  - 'airdrop OR "token launch"'

# Query templates applied to each seed handle (mention expansion)
mention_query_templates:
  - '(@{handle}) (crypto OR bitcoin OR ethereum OR defi OR solana)'

# Pipeline limits
search_max_results_per_query: 40
search_max_queries: 12
expand_top_n: 15
expand_mentions_per_account: 20
max_candidates: 200
recent_tweets_per_account: 10

# Hard filters
min_followers: 1000
min_domain_score: 0.15

# Explainable influence score weights (must sum ~1 for interpretability)
score_weights:
  followers: 0.15
  engagement: 0.25
  recency: 0.10
  domain: 0.35
  seed_proximity: 0.10
  completeness: 0.05

# Lexicon for domain relevance (bio + recent tweets)
domain_lexicon:
  - bitcoin
  - btc
  - ethereum
  - eth
  - solana
  - sol
  - crypto
  - cryptocurrency
  - blockchain
  - defi
  - web3
  - nft
  - token
  - airdrop
  - memecoin
  - onchain
  - on-chain
  - layer2
  - layer-2
  - wallet
  - trading
  - trader
  - altcoin
  - stablecoin
  - dao
  - dapp
  - smart contract
  - binance
  - coinbase
  - chainlink
  - polygon
  - avalanche
  - cosmos
  - yield
  - liquidity
  - staking

# Bilingual query expansion and global-library categories.
topic_aliases:
  bitcoin: [bitcoin, btc, 比特币, 比特幣]
  ethereum_l2: [ethereum, eth, "layer 2", rollup, 以太坊, 二层, 扩容]
  solana: [solana, sol, 索拉纳]
  defi: [defi, "decentralized finance", 去中心化金融]
  stablecoin_rwa: [stablecoin, rwa, "real world assets", 稳定币, 真实世界资产]
  nft_gamefi: [nft, gamefi, "web3 gaming", 链游, 加密艺术]
  memecoin: [memecoin, "meme coin", 模因币, 土狗]
  airdrop: [airdrop, testnet, points, 空投, 测试网, 积分]
  onchain_security: [onchain, "on-chain", "crypto security", 链上分析, 链上安全]
  trading_macro: ["crypto trading", macro, liquidity, 加密交易, 宏观, 流动性]
  regulation: ["crypto regulation", mica, sec, 加密监管, 政策]
  infra_ai_depin: ["crypto infrastructure", depin, "crypto ai", 加密基础设施]
